      /* Boot splash: shown before the JS bundle loads so the page is

      .boot-splash {

        flex-direction: column;

        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 800;
        color: #fff;
      }
      .boot-name {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

        border: 3px solid rgba(139, 92, 246, 0.25);

      }
